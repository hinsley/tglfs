name: CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/tglfs-cli/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "packages/tglfs-cli/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture dependency install
        id: install
        shell: bash
        run: |
          set +e
          npm ci >npm-ci.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: npm-ci.log
      - name: Fail if dependency installation failed
        if: steps.install.outputs.status != '0'
        run: exit 1
      - run: npm run build:cli
      - run: npm test
