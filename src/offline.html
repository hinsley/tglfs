<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>TGLFS</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <link href="./style.css" rel="stylesheet" />
        <link rel="icon" href="/icons/TGLFS logo 192.png" sizes="192x192" type="image/png" />
        <link rel="manifest" href="/manifest.json" />
    </head>
    <body>
        <div id="app">
            <section class="auth">
                <div id="offline" class="auth-card">
                    <div class="auth-brand">
                        <img src="/icons/TGLFS logo 192.png" alt="" class="auth-logo" />
                        <div>
                            <div class="auth-brand-name">TGLFS</div>
                            <div class="auth-brand-tag">Telegram Large File Storage</div>
                        </div>
                    </div>
                    <div class="auth-header">
                        <h1 class="auth-title">You are offline</h1>
                        <p class="auth-subtitle">TGLFS requires an active internet connection. Check your connection and try again.</p>
                    </div>
                    <button type="button" class="fx-btn fx-btn-primary fx-btn-lg fx-btn-block" onclick="location.reload()">Try again</button>
                </div>
            </section>
        </div>
    </body>
</html>
